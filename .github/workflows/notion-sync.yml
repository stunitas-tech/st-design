name: Notion Sync

on:
    repository_dispatch:
        types: [notion-sync]

permissions:
    contents: write

jobs:
    sync:
        runs-on: ubuntu-latest

        env:
            NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
            NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install

            - name: Run Notion Sync Script
              run: bun run notion:sync

            - name: Commit & Push
              run: |
                  git config user.name "notion-bot"
                  git config user.email "notion-bot@users.noreply.github.com"

                  git add .

                  DATE=$(TZ=Asia/Seoul date "+%y년 %-m월 %-d일 %-H시 %-M분")

                  git commit -m "노션 문서 내용 반영 ($DATE)" || echo "변경된 데이터가 없습니다 ($DATE)"
                  git push
