name: Notion Sync

on:
    repository_dispatch:
        types: [notion-sync]

permissions:
    contents: write

jobs:
    sync:
        runs-on: ubuntu-latest

        env:
            NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
            NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install

            - name: Run Notion Sync Script
              run: bun run notion:sync

            - name: Commit & Push
              run: |
                  git config user.name "notion-bot"
                  git config user.email "notion-bot@users.noreply.github.com"

                  git add .
                  git commit -m "sync from notion" || echo "no changes"
                  git push
